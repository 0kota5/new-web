<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>レストラン</title>

    <!-- 📱 iPhoneの「.jpeg」バグを突破するアイコン強制認識コード -->
    <link rel="apple-touch-icon" type="image/jpeg" href="IMG_3788.jpeg">
    <link rel="icon" type="image/jpeg" href="IMG_3788.jpeg">

    <!-- 🤖 Android用のPWA設定ファイルの読み込み -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#333333">

    <style>
        html, body { margin: 0; padding: 0; min-height: 100vh; width: 100%; }
        body { 
            font-family: sans-serif; color: #222; line-height: 1.6; text-align: center; 
            background-image: url('IMG_5462.jpeg'); background-attachment: fixed; 
            background-size: cover; background-position: center; background-repeat: no-repeat; background-color: #333;
        }
        header { background: transparent !important; color: white; padding: 40px 20px 10px; box-shadow: none !important; }
        header h1 { margin: 0; font-size: 1.8rem; text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8); }
        main { 
            padding: 30px 20px; max-width: 500px; margin: 20px auto 40px; 
            background: rgba(255, 255, 255, 0.20); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); 
            border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.4); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2); text-align: left; 
        }
        .menu-buttons { display: flex; flex-direction: column; gap: 15px; margin: 30px 0; }
        .btn { 
            display: block; background: rgba(255, 255, 255, 0.35); color: #1a365d; padding: 16px; 
            text-decoration: none; border-radius: 10px; font-weight: bold; font-size: 1.1rem; text-align: center; 
            border: 1px solid rgba(255, 255, 255, 0.5); box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08); 
        }
        section { margin-bottom: 30px; text-align: left; }
        footer { padding: 20px; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,0.8); font-size: 0.8rem; margin-top: 30px; text-align: center; }
        .info-p { margin: 8px 0; color: #111; }
        h2 { font-size: 1.3rem; color: #1a365d; margin-top: 0; margin-bottom: 15px; border-bottom: 2px solid rgba(26, 54, 93, 0.5); padding-bottom: 5px; }
    </style>
</head>
<body>
    <header><h1>レストラン</h1></header>
    <main>
        <section>
            <h2>お品書き（メニュー）</h2>
            <p>ご覧になりたいメニューを選んでください。</p>
            <div class="menu-buttons">
                <a href="general.html" class="btn">一般メニュー</a>
                <a href="evening.html" class="btn">夕方（夜）メニュー</a>
            </div>
        </section>
        <section style="border-top: 1px solid rgba(255, 255, 255, 0.3); padding-top: 20px; margin-top: 30px;">
            <h2>店舗情報</h2>
            <p class="info-p"><strong>営業時間：</strong>11:30 〜 21:00</p>
            <p class="info-p"><strong>住所：</strong>東京都渋谷区</p>
            <p class="info-p"><strong>電話番号：</strong>03-XXXX-XXXX</p>
        </section>
    </main>
    <footer><p>&copy; 2026 レストラン</p></footer>
</body>
</html>
